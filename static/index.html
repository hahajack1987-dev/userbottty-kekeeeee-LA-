<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAGE UserBot Panel</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1 class="neon-title">⚡ RAGE USERBOT ⚡</h1>
        
        <div class="card">
            <h2>Konfigürasyon</h2>
            <label>Chat ID'leri (virgülle ayır)</label>
            <input type="text" id="chatIds" placeholder="123456789, 987654321" value="123456789">

            <label>Mesajlar (virgülle ayır)</label>
            <textarea id="messages" rows="3" placeholder="Selam, Nasılsın?, İyi günler"></textarea>

            <label>Gecikme (saniye)</label>
            <input type="number" id="delaySec" value="3" step="0.5" min="0.5">

            <label class="checkbox-label">
                <input type="checkbox" id="loop"> Sonsuz döngü (mesaj listesi bitince başa dön)
            </label>

            <div class="button-group">
                <button id="saveBtn" class="btn neon-green">💾 Kaydet</button>
                <button id="startBtn" class="btn neon-blue">▶ Başlat</button>
                <button id="stopBtn" class="btn neon-red">⏹ Durdur</button>
            </div>
        </div>

        <div class="card">
            <h2>Durum</h2>
            <div id="status" class="status-text">⏳ Bilgi bekleniyor...</div>
        </div>

        <div class="card">
            <h2>Canlı Loglar</h2>
            <div id="logArea" class="log-area"></div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
              </html>
